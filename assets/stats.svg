<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" fill="none" role="img" aria-label="Estadísticas de GitHub de Pablo Mateos">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
    <clipPath id="round3"><rect width="1000" height="250" rx="18"/></clipPath>
    <clipPath id="barclip"><rect x="60" y="196" width="880" height="12" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#round3)">
    <rect width="1000" height="250" fill="url(#bg3)"/>
    <rect width="1000" height="250" fill="url(#grid3)"/>

    <!-- Métricas -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="64" y="92" font-size="46" font-weight="700" fill="#fafafa">36</text>
      <text x="64" y="116" font-size="12" fill="#71717a" letter-spacing="2">PROYECTOS</text>

      <text x="304" y="92" font-size="46" font-weight="700" fill="#fafafa">1.066</text>
      <text x="304" y="116" font-size="12" fill="#71717a" letter-spacing="2">PULL REQUESTS</text>

      <text x="544" y="92" font-size="46" font-weight="700" fill="#fafafa">162</text>
      <text x="544" y="116" font-size="12" fill="#71717a" letter-spacing="2">CONTRIB. · 12 MESES</text>

      <text x="784" y="92" font-size="46" font-weight="700" fill="#fafafa">3</text>
      <text x="784" y="116" font-size="12" fill="#71717a" letter-spacing="2">ORGANIZACIONES</text>
    </g>

    <line x1="284" y1="48" x2="284" y2="128" stroke="#ffffff" stroke-opacity="0.07"/>
    <line x1="524" y1="48" x2="524" y2="128" stroke="#ffffff" stroke-opacity="0.07"/>
    <line x1="764" y1="48" x2="764" y2="128" stroke="#ffffff" stroke-opacity="0.07"/>

    <line x1="60" y1="156" x2="940" y2="156" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Lenguajes -->
    <text x="64" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#71717a" letter-spacing="3">LENGUAJES · POR BYTES</text>

    <g clip-path="url(#barclip)">
      <rect x="60"  y="196" width="207" height="12" fill="#fafafa" fill-opacity="0.92"/>
      <rect x="269" y="196" width="163" height="12" fill="#fafafa" fill-opacity="0.80"/>
      <rect x="434" y="196" width="86"  height="12" fill="#fafafa" fill-opacity="0.68"/>
      <rect x="522" y="196" width="68"  height="12" fill="#fafafa" fill-opacity="0.58"/>
      <rect x="592" y="196" width="66"  height="12" fill="#fafafa" fill-opacity="0.50"/>
      <rect x="660" y="196" width="61"  height="12" fill="#fafafa" fill-opacity="0.43"/>
      <rect x="723" y="196" width="48"  height="12" fill="#fafafa" fill-opacity="0.37"/>
      <rect x="773" y="196" width="43"  height="12" fill="#fafafa" fill-opacity="0.32"/>
      <rect x="818" y="196" width="122" height="12" fill="#fafafa" fill-opacity="0.20"/>
    </g>

    <!-- Leyenda -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">
      <circle cx="64"  cy="231" r="4" fill="#fafafa" fill-opacity="0.92"/><text x="74"  y="235">Python 24%</text>
      <circle cx="214" cy="231" r="4" fill="#fafafa" fill-opacity="0.80"/><text x="224" y="235">HTML 19%</text>
      <circle cx="354" cy="231" r="4" fill="#fafafa" fill-opacity="0.68"/><text x="364" y="235">TypeScript 10%</text>
      <circle cx="534" cy="231" r="4" fill="#fafafa" fill-opacity="0.58"/><text x="544" y="235">JavaScript 8%</text>
      <circle cx="704" cy="231" r="4" fill="#fafafa" fill-opacity="0.50"/><text x="714" y="235">PHP 8%</text>
      <circle cx="820" cy="231" r="4" fill="#fafafa" fill-opacity="0.43"/><text x="830" y="235">Liquid 7%</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="249" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
