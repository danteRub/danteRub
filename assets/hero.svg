<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none" role="img" aria-label="Pablo Mateos — Ingeniero de software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="230" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <rect width="1000" height="230" fill="url(#grid)"/>
    <rect width="1000" height="230" fill="url(#glow)"/>

    <text x="64" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#52525b" letter-spacing="1.5">pablo@onmi:~$ whoami</text>

    <text x="61" y="126" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#fafafa" letter-spacing="0.5">Pablo Mateos</text>
    <rect x="64" y="144" width="140" height="3" rx="1.5" fill="#fafafa"/>

    <text x="64" y="184" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#a1a1aa">Ingeniero de software — producto de negocio de principio a fin</text>

    <text x="64" y="210" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#52525b">Murcia, España &#160;·&#160; onmi.es</text>

    <g>
      <circle cx="888" cy="115" r="62" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.25"/>
      <text x="888" y="132" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#fafafa">PM</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="229" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
