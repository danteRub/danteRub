<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" fill="none" role="img" aria-label="Pablo Mateos — Ingeniero de software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#101016"/>
    </linearGradient>
    <radialGradient id="aur1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="250" rx="18"/></clipPath>

    <!-- Nombre para recortar el brillo -->
    <clipPath id="nameClip">
      <text x="61" y="130" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="0.5">Pablo Mateos</text>
    </clipPath>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="250" fill="url(#bg)"/>

    <!-- Aurora monocroma que respira -->
    <ellipse cx="820" cy="40" rx="360" ry="260" fill="url(#aur1)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 30; 20 -20; 0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="120" cy="240" rx="320" ry="220" fill="url(#aur2)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 50 -24; -30 16; 0 0" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <rect width="1000" height="250" fill="url(#grid)"/>

    <!-- Prompt de terminal + cursor que parpadea -->
    <text x="64" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#52525b" letter-spacing="1.5">pablo@onmi:~$ whoami</text>
    <rect x="252" y="49" width="9" height="15" fill="#38bdf8">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>

    <!-- Nombre (base blanco) -->
    <text x="61" y="130" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#fafafa" letter-spacing="0.5">Pablo Mateos</text>
    <!-- Brillo metálico que recorre el nombre -->
    <g clip-path="url(#nameClip)">
      <rect x="-260" y="78" width="200" height="60" fill="url(#glint)" transform="skewX(-18)">
        <animate attributeName="x" values="-260;640" dur="4.8s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="64" y="144" width="140" height="3" rx="1.5" fill="#fafafa"/>

    <text x="64" y="184" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#a1a1aa">Ingeniero de software — producto de negocio de principio a fin</text>
    <text x="64" y="212" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#52525b">Murcia, España &#160;·&#160; onmi.es</text>

    <!-- Monograma con reflejo que orbita -->
    <g>
      <circle cx="888" cy="120" r="62" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.25"/>
      <g transform="rotate(0 888 120)">
        <circle cx="888" cy="120" r="62" fill="none" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.5" pathLength="100" stroke-dasharray="14 86" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="0 888 120" to="360 888 120" dur="7s" repeatCount="indefinite"/>
      </g>
      <text x="888" y="137" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#fafafa">PM</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="249" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
