<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" fill="none" role="img" aria-label="Pablo Mateos — Ingeniero de software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="240" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)"/>
    <rect width="1000" height="240" fill="url(#glow)"/>
    <rect x="0" y="0" width="6" height="240" fill="url(#accent)"/>

    <text x="60" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#22d3ee" letter-spacing="1.5">pablo@onmi:~$ whoami</text>

    <text x="57" y="130" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Pablo Mateos</text>
    <rect x="61" y="148" width="156" height="4" rx="2" fill="url(#accent)"/>

    <text x="60" y="190" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#cbd5e1">Ingeniero de software — producto de negocio de principio a fin</text>

    <text x="60" y="218" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Murcia, España &#160;·&#160; onmi.es</text>

    <g>
      <circle cx="884" cy="120" r="66" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.85"/>
      <circle cx="884" cy="120" r="54" fill="#0b1020"/>
      <text x="884" y="139" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">PM</text>
    </g>
  </g>
</svg>
