<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" fill="none" role="img" aria-label="pablo@mateOS — sesión de terminal">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080a"/>
      <stop offset="1" stop-color="#0d0d12"/>
    </linearGradient>
    <pattern id="dgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <clipPath id="dround"><rect width="1000" height="600" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#dround)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <rect width="1000" height="600" fill="url(#dbg)"/>
    <rect width="1000" height="600" fill="url(#dgrid)"/>

    <!-- Barra de título -->
    <circle cx="26" cy="18" r="6" fill="#3f3f46"/>
    <circle cx="46" cy="18" r="6" fill="#3f3f46"/>
    <circle cx="66" cy="18" r="6" fill="#38bdf8" fill-opacity="0.9"/>
    <text x="500" y="23" text-anchor="middle" font-size="12.5" fill="#52525b">pablo@mateOS: tmux — 1 sesión, 3 ventanas</text>
    <line x1="0" y1="34" x2="1000" y2="34" stroke="#ffffff" stroke-opacity="0.07"/>

    <!-- Bordes de panes (tmux) -->
    <line x1="512" y1="34" x2="512" y2="396" stroke="#ffffff" stroke-opacity="0.07"/>
    <line x1="0" y1="396" x2="1000" y2="396" stroke="#ffffff" stroke-opacity="0.07"/>

    <!-- ============ PANE A: fastfetch ============ -->
    <text x="20" y="58" font-size="13.5" fill="#22c55e">❯</text>
    <text x="36" y="58" font-size="13.5" fill="#e4e4e7">fastfetch</text>

    <!-- logo -->
    <path d="M104 92 L156 210 L52 210 Z" fill="#38bdf8" fill-opacity="0.05" stroke="#38bdf8" stroke-opacity="0.85" stroke-width="2" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="1.2s" begin="0s" fill="freeze"/>
    </path>
    <path d="M104 126 L138 210 M104 126 L70 210" fill="none" stroke="#e4e4e7" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="1.2s" begin="0.2s" fill="freeze"/>
    </path>

    <!-- info -->
    <g font-size="13">
      <text x="200" y="98" fill="#38bdf8" font-weight="700">pablo</text><text x="236" y="98" fill="#52525b">@</text><text x="246" y="98" fill="#38bdf8" font-weight="700">mateOS</text>
      <text x="200" y="116" fill="#3f3f46">──────────────────</text>
      <text x="200" y="138" fill="#38bdf8">OS</text><text x="300" y="138" fill="#d4d4d8">Arch Linux</text>
      <text x="200" y="158" fill="#38bdf8">DE</text><text x="300" y="158" fill="#d4d4d8">mateOS (propio)</text>
      <text x="200" y="178" fill="#38bdf8">WM</text><text x="300" y="178" fill="#d4d4d8">Hyprland · Lua</text>
      <text x="200" y="198" fill="#38bdf8">Shell</text><text x="300" y="198" fill="#d4d4d8">Quickshell / QML</text>
      <text x="200" y="218" fill="#38bdf8">Entorno</text><text x="300" y="218" fill="#d4d4d8">Neovim · kitty</text>
      <text x="200" y="238" fill="#38bdf8">Pkg</text><text x="300" y="238" fill="#d4d4d8">pacman · paru</text>
      <text x="200" y="258" fill="#38bdf8">Boot</text><text x="300" y="258" fill="#d4d4d8">Limine · UKI · SB</text>
    </g>
    <!-- paleta -->
    <g>
      <rect x="200" y="286" width="15" height="13" rx="2" fill="#fafafa" fill-opacity="0.9"/>
      <rect x="221" y="286" width="15" height="13" rx="2" fill="#fafafa" fill-opacity="0.68"/>
      <rect x="242" y="286" width="15" height="13" rx="2" fill="#fafafa" fill-opacity="0.5"/>
      <rect x="263" y="286" width="15" height="13" rx="2" fill="#fafafa" fill-opacity="0.36"/>
      <rect x="284" y="286" width="15" height="13" rx="2" fill="#fafafa" fill-opacity="0.24"/>
      <rect x="305" y="286" width="15" height="13" rx="2" fill="#22c55e" fill-opacity="0.85"/>
      <rect x="326" y="286" width="15" height="13" rx="2" fill="#38bdf8" fill-opacity="0.85"/>
    </g>

    <!-- ============ PANE B: tokei ============ -->
    <text x="532" y="58" font-size="13.5" fill="#22c55e">❯</text>
    <text x="548" y="58" font-size="13.5" fill="#e4e4e7">tokei --sort bytes</text>

    <text x="532" y="86" font-size="11.5" fill="#52525b" letter-spacing="1.5">LENGUAJE</text>
    <text x="900" y="86" font-size="11.5" fill="#52525b" letter-spacing="1.5">%</text>

    <g font-size="13" fill="#d4d4d8">
      <text x="532" y="110">Python</text>
      <text x="532" y="132">HTML</text>
      <text x="532" y="154">TypeScript</text>
      <text x="532" y="176">JavaScript</text>
      <text x="532" y="198">PHP</text>
      <text x="532" y="220">Liquid</text>
      <text x="532" y="242">C#</text>
      <text x="532" y="264">QML</text>
    </g>

    <g fill="#e4e4e7">
      <rect x="660" y="102" height="9" rx="2" width="190" fill-opacity="0.9"><animate attributeName="width" values="0;190" dur="0.9s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/></rect>
      <rect x="660" y="124" height="9" rx="2" width="150" fill-opacity="0.78"><animate attributeName="width" values="0;150" dur="0.9s" begin="0.22s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/></rect>
      <rect x="660" y="146" height="9" rx="2" width="79" fill-opacity="0.66"><animate attributeName="width" values="0;79" dur="0.9s" begin="0.29s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/></rect>
      <rect x="660" y="168" height="9" rx="2" width="63" fill-opacity="0.56"><animate attributeName="width" values="0;63" dur="0.9s" begin="0.36s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/></rect>
      <rect x="660" y="190" height="9" rx="2" width="62" fill-opacity="0.48"><animate attributeName="width" values="0;62" dur="0.9s" begin="0.43s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/></rect>
      <rect x="660" y="212" height="9" rx="2" width="55" fill-opacity="0.4"><animate attributeName="width" values="0;55" dur="0.9s" begin="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/></rect>
      <rect x="660" y="234" height="9" rx="2" width="47" fill-opacity="0.34"><animate attributeName="width" values="0;47" dur="0.9s" begin="0.57s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/></rect>
      <rect x="660" y="256" height="9" rx="2" width="40" fill-opacity="0.28"><animate attributeName="width" values="0;40" dur="0.9s" begin="0.64s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/></rect>
    </g>

    <g font-size="12.5" fill="#71717a" text-anchor="end">
      <text x="896" y="110">24</text>
      <text x="896" y="132">19</text>
      <text x="896" y="154">10</text>
      <text x="896" y="176">8</text>
      <text x="896" y="198">8</text>
      <text x="896" y="220">7</text>
      <text x="896" y="242">6</text>
      <text x="896" y="264">5</text>
    </g>

    <line x1="532" y1="282" x2="900" y2="282" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="532" y="304" font-size="12.5" fill="#52525b">Total</text>
    <text x="900" y="304" font-size="12.5" fill="#d4d4d8" text-anchor="end">14.0M bytes · 36 repos</text>

    <!-- ============ PANE C: systemctl ============ -->
    <text x="20" y="422" font-size="13.5" fill="#22c55e">❯</text>
    <text x="36" y="422" font-size="13.5" fill="#e4e4e7">systemctl --user list-units --state=running</text>

    <g font-size="13">
      <circle cx="26" cy="450" r="4.5" fill="#22c55e"><animate attributeName="fill-opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/></circle>
      <text x="42" y="454" fill="#fafafa">onmi-contabilidad.service</text>
      <text x="340" y="454" fill="#22c55e">active (running)</text>
      <text x="520" y="454" fill="#71717a">OAuth 2.1 · RLS · multiempresa</text>

      <circle cx="26" cy="476" r="4.5" fill="#22c55e"><animate attributeName="fill-opacity" values="1;0.5;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
      <text x="42" y="480" fill="#fafafa">onmi-inmobiliaria.service</text>
      <text x="340" y="480" fill="#22c55e">active (running)</text>
      <text x="520" y="480" fill="#71717a">Astro · Supabase · PostgreSQL</text>

      <circle cx="26" cy="502" r="4.5" fill="#22c55e"><animate attributeName="fill-opacity" values="1;0.5;1" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
      <text x="42" y="506" fill="#fafafa">sec-agentes.target</text>
      <text x="340" y="506" fill="#22c55e">active (running)</text>
      <text x="520" y="506" fill="#71717a">servidores MCP · gateway · bots</text>

      <circle cx="26" cy="528" r="4.5" fill="#22c55e"><animate attributeName="fill-opacity" values="1;0.5;1" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="42" y="532" fill="#fafafa">sec-shop.service</text>
      <text x="340" y="532" fill="#22c55e">active (running)</text>
      <text x="520" y="532" fill="#71717a">Shopify · Liquid · tema a medida</text>

      <circle cx="26" cy="554" r="4.5" fill="#22c55e"><animate attributeName="fill-opacity" values="1;0.5;1" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
      <text x="42" y="558" fill="#fafafa">mateos-desktop.service</text>
      <text x="340" y="558" fill="#22c55e">active (running)</text>
      <text x="520" y="558" fill="#71717a">Hyprland · Quickshell · .NET</text>
    </g>

    <!-- ============ Barra de estado tmux ============ -->
    <rect x="0" y="568" width="1000" height="32" fill="#15803d"/>
    <rect x="0" y="568" width="92" height="32" fill="#22c55e"/>
    <text x="46" y="588" text-anchor="middle" font-size="12.5" font-weight="700" fill="#052e16">[onmi]</text>
    <text x="108" y="588" font-size="12.5" fill="#bbf7d0">0:sys  1:code  2:infra</text>
    <text x="252" y="588" font-size="12.5" fill="#f0fdf4" font-weight="700">*</text>
    <text x="980" y="588" text-anchor="end" font-size="12.5" fill="#dcfce7">pablo@mateOS · Murcia · 36 repos · 1.066 PRs · 2023</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="599" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
